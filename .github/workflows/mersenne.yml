name: Ramsey Search Multi Hash Concat
on: [workflow_dispatch]
jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Run Multi Hash Search Algorithm Concat
        run: |
          python -c '
          import hashlib,itertools,zlib
          funcs=[
           ("sha256",lambda v:int(hashlib.sha256(v).hexdigest()[-1],16)),
           ("md5",lambda v:int(hashlib.md5(v).hexdigest()[-1],16)),
           ("sha1",lambda v:int(hashlib.sha1(v).hexdigest()[-1],16)),
           ("sha512",lambda v:int(hashlib.sha512(v).hexdigest()[-1],16)),
           ("blake2s",lambda v:int(hashlib.blake2s(v).hexdigest()[-1],16)),
           ("crc32",lambda v:zlib.crc32(v)%16),
           ("adler32",lambda v:zlib.adler32(v)%16),
           ("builtin",lambda v:abs(hash(v))%16)
          ]
          masks=[sum(1<<i for i in p) for p in itertools.combinations(range(16),8)]
          for N in range(43,49):
           print("=== N = "+str(N)+" ===")
           for n,F in funcs:
            print("Testing: "+n)
            h={}
            for x,y in itertools.combinations(range(1,N+1),2):
             h[(x,y)]=F((str(x)+str(y)).encode())
            s=set()
            for c in itertools.combinations(range(1,N+1),5):
             m=0
             for i in range(5):
              for j in range(i+1,5):
               m|=1<<h[(c[i],c[j])]
             s.add(m)
            f=0
            for a in masks:
             b=(~a)&65535
             if not any((x&~a)==0 or (x&~b)==0 for x in s):
              print("Success! N: "+str(N)+" A:",[i for i in range(16) if a&(1<<i)],"B:",[i for i in range(16) if b&(1<<i)])
              f=1
            if not f:print("Failed.")
          '
