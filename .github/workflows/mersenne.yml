name: Ramsey Search
on: [workflow_dispatch]
jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Run Search Algorithm
        run: |
          python -c '
          import hashlib,itertools
          h={}
          for x,y in itertools.combinations(range(1,44),2):
           h[(x,y)]=int(hashlib.sha256(str(x+y).encode()).hexdigest()[-1],16)
          s=set()
          for c in itertools.combinations(range(1,44),5):
           m=0
           for i in range(5):
            for j in range(i+1,5):
             m|=1<<h[(c[i],c[j])]
           s.add(m)
          f=0
          for a in range(32768):
           a|=1;b=(~a)&65535
           if not any((x&~a)==0 or (x&~b)==0 for x in s):
            print("Success! A:",[i for i in range(16) if a&(1<<i)],"B:",[i for i in range(16) if b&(1<<i)])
            f=1
          if not f:print("All patterns failed.")
          '
