name: Ramsey Search Cyclic DFS
on: [workflow_dispatch]
jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Run DFS Algorithm
        run: |
          python -c '
          import itertools
          for N in range(42,49):
           print("=== N = "+str(N)+" ===")
           D=N//2;s=set()
           for c in itertools.combinations(range(N),5):
            m=0
            for i in range(5):
             for j in range(i+1,5):
              d=min(abs(c[i]-c[j]),N-abs(c[i]-c[j]))
              m|=1<<(d-1)
            s.add(m)
           b=[[] for _ in range(D)]
           for x in s:
            for i in range(D-1,-1,-1):
             if x&(1<<i):b[i].append(x);break
           st=[(0,0,0)];f=0
           while st:
            i,A,B=st.pop()
            if i==D:
             print("Success! N="+str(N)+" A_distances:",[k+1 for k in range(D) if A&(1<<k)]);f=1;break
            for C in [(0,1),(1,0)]:
             nA=A|(C[0]<<i);nB=B|(C[1]<<i)
             if not any((z&~nA)==0 or (z&~nB)==0 for z in b[i]):st.append((i+1,nA,nB))
           if not f:print("Failed.")
          '
